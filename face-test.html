<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Face Detection Test - Fase 1</title>
    <script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background: #0f172a;
            color: #e2e8f0;
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        h1 {
            color: #3b82f6;
            margin-bottom: 10px;
            font-size: 24px;
        }
        .status {
            background: #1e293b;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            border-left: 3px solid #3b82f6;
            font-size: 14px;
        }
        .status.error {
            border-left-color: #ef4444;
            background: #7f1d1d;
        }
        .status.success {
            border-left-color: #22c55e;
            background: #14532d;
        }
        .video-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        .video-box {
            position: relative;
            background: #1e293b;
            border-radius: 8px;
            overflow: hidden;
        }
        .video-box h3 {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 10;
            background: rgba(0,0,0,0.7);
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 13px;
            font-weight: 600;
        }
        video, canvas {
            width: 100%;
            display: block;
            transform: scaleX(-1);
        }
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        button {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        button:hover:not(:disabled) {
            background: #2563eb;
            transform: translateY(-1px);
        }
        button:disabled {
            background: #475569;
            cursor: not-allowed;
            opacity: 0.6;
        }
        button.secondary {
            background: #64748b;
        }
        button.secondary:hover:not(:disabled) {
            background: #475569;
        }
        button.success {
            background: #22c55e;
        }
        button.success:hover:not(:disabled) {
            background: #16a34a;
        }
        .result {
            background: #1e293b;
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .result h3 {
            margin-bottom: 12px;
            color: #3b82f6;
            font-size: 16px;
        }
        .result-item {
            background: #0f172a;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 8px;
            font-size: 13px;
            font-family: 'Courier New', monospace;
        }
        .result-item.match {
            border-left: 3px solid #22c55e;
        }
        .result-item.nomatch {
            border-left: 3px solid #ef4444;
        }
        #log {
            background: #0a0f1a;
            padding: 12px;
            border-radius: 6px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            max-height: 200px;
            overflow-y: auto;
            white-space: pre-wrap;
            color: #94a3b8;
            border: 1px solid #1e293b;
        }
        .descriptor-preview {
            background: #0f172a;
            padding: 8px;
            border-radius: 4px;
            margin-top: 8px;
            font-size: 11px;
            color: #64748b;
            max-height: 60px;
            overflow: hidden;
            text-overflow: ellipsis;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 Face Detection Prototype - Fase 1</h1>
        <p style="margin-bottom: 20px; color: #94a3b8; font-size: 14px;">Test face-api.js: detection, landmark, recognition</p>

        <div class="status" id="status">⏳ Loading face-api.js models...</div>

        <div class="controls">
            <button id="btn-start" onclick="startCamera()" disabled>📷 Start Camera</button>
            <button id="btn-capture-a" onclick="captureFace('A')" disabled>🎯 Capture Person A</button>
            <button id="btn-capture-b" onclick="captureFace('B')" disabled>🎯 Capture Person B</button>
            <button class="success" id="btn-compare" onclick="compareFaces()" disabled>⚖️ Compare A vs B</button>
            <button class="secondary" onclick="resetTest()">🔄 Reset</button>
        </div>

        <div class="video-grid">
            <div class="video-box">
                <h3>Live Camera</h3>
                <video id="video" autoplay playsinline muted></video>
                <canvas id="overlay"></canvas>
            </div>
            <div class="video-box">
                <h3>Last Captured</h3>
                <canvas id="captured"></canvas>
            </div>
        </div>

        <div class="result" id="result-box" style="display: none;">
            <h3>Comparison Result</h3>
            <div id="result-content"></div>
        </div>

        <div class="result">
            <h3>Console Log</h3>
            <div id="log">Waiting...</div>
        </div>
    </div>

    <script>
        // State
        let videoStream = null;
        let modelsLoaded = false;
        let faceDescriptorA = null;
        let faceDescriptorB = null;
        const DISTANCE_THRESHOLD = 0.6; // <0.6 = sama orang, >0.6 = beda

        const video = document.getElementById('video');
        const overlay = document.getElementById('overlay');
        const captured = document.getElementById('captured');

        // Logger
        function log(msg, type = 'info') {
            const logEl = document.getElementById('log');
            const timestamp = new Date().toLocaleTimeString();
            const prefix = type === 'error' ? '❌' : type === 'success' ? '✅' : '📝';
            logEl.textContent += `\n[${timestamp}] ${prefix} ${msg}`;
            logEl.scrollTop = logEl.scrollHeight;
            console.log(msg);
        }

        function setStatus(msg, type = 'info') {
            const statusEl = document.getElementById('status');
            statusEl.textContent = msg;
            statusEl.className = 'status';
            if (type === 'error') statusEl.classList.add('error');
            if (type === 'success') statusEl.classList.add('success');
        }

        // Load Models
        async function loadModels() {
            try {
                log('Loading face detection models...');
                const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/model';
                
                await Promise.all([
                    faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
                    faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
                    faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
                ]);

                modelsLoaded = true;
                log('Models loaded successfully!', 'success');
                setStatus('✅ Models ready! Click "Start Camera"', 'success');
                document.getElementById('btn-start').disabled = false;
            } catch (err) {
                log('Failed to load models: ' + err.message, 'error');
                setStatus('❌ Failed to load models. Check console.', 'error');
            }
        }

        // Start Camera
        async function startCamera() {
            try {
                log('Requesting camera access...');
                videoStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { width: 640, height: 480 } 
                });
                video.srcObject = videoStream;
                
                video.addEventListener('play', () => {
                    log('Camera started!', 'success');
                    setStatus('✅ Camera active. Detecting faces...', 'success');
                    
                    // Setup overlay canvas
                    overlay.width = video.videoWidth;
                    overlay.height = video.videoHeight;
                    
                    document.getElementById('btn-capture-a').disabled = false;
                    document.getElementById('btn-capture-b').disabled = false;
                    document.getElementById('btn-start').disabled = true;
                    
                    detectFacesLoop();
                });
            } catch (err) {
                log('Camera error: ' + err.message, 'error');
                setStatus('❌ Camera access denied', 'error');
            }
        }

        // Real-time Face Detection Loop
        async function detectFacesLoop() {
            if (!videoStream) return;

            const detections = await faceapi
                .detectAllFaces(video, new faceapi.TinyFaceDetectorOptions())
                .withFaceLandmarks();

            // Draw overlay
            const ctx = overlay.getContext('2d');
            ctx.clearRect(0, 0, overlay.width, overlay.height);
            
            if (detections.length > 0) {
                faceapi.draw.drawDetections(overlay, detections);
                faceapi.draw.drawFaceLandmarks(overlay, detections);
            }

            requestAnimationFrame(detectFacesLoop);
        }

        // Capture Face and Extract Descriptor
        async function captureFace(person) {
            try {
                log(`Capturing face for Person ${person}...`);
                
                // Detect ALL faces first to validate count
                const allDetections = await faceapi
                    .detectAllFaces(video, new faceapi.TinyFaceDetectorOptions())
                    .withFaceLandmarks()
                    .withFaceDescriptors();

                if (allDetections.length === 0) {
                    log('No face detected! Position your face in frame.', 'error');
                    setStatus('❌ No face detected', 'error');
                    return;
                }

                if (allDetections.length > 1) {
                    log(`Detected ${allDetections.length} faces! Only 1 person allowed.`, 'error');
                    setStatus('❌ Harus 1 wajah saja!', 'error');
                    return;
                }

                const detection = allDetections[0];

                // Save descriptor
                const descriptor = detection.descriptor;
                if (person === 'A') {
                    faceDescriptorA = descriptor;
                    log(`Person A captured! Descriptor: ${descriptor.length} dimensions`, 'success');
                } else {
                    faceDescriptorB = descriptor;
                    log(`Person B captured! Descriptor: ${descriptor.length} dimensions`, 'success');
                }

                // Draw captured face
                captured.width = video.videoWidth;
                captured.height = video.videoHeight;
                const ctx = captured.getContext('2d');
                ctx.drawImage(video, 0, 0);
                
                // Draw detection box on captured
                const box = detection.detection.box;
                ctx.strokeStyle = '#22c55e';
                ctx.lineWidth = 3;
                ctx.strokeRect(box.x, box.y, box.width, box.height);

                setStatus(`✅ Person ${person} captured`, 'success');

                // Enable compare if both captured
                if (faceDescriptorA && faceDescriptorB) {
                    document.getElementById('btn-compare').disabled = false;
                }
            } catch (err) {
                log('Capture error: ' + err.message, 'error');
                setStatus('❌ Capture failed', 'error');
            }
        }

        // Compare Faces
        function compareFaces() {
            if (!faceDescriptorA || !faceDescriptorB) {
                log('Need both Person A and Person B captured!', 'error');
                return;
            }

            log('Computing face distance...');
            
            const distance = faceapi.euclideanDistance(faceDescriptorA, faceDescriptorB);
            const isSamePerson = distance < DISTANCE_THRESHOLD;
            const similarity = ((1 - distance) * 100).toFixed(1);

            log(`Distance: ${distance.toFixed(4)} | Same person: ${isSamePerson}`, 'success');

            // Display result
            const resultBox = document.getElementById('result-box');
            const resultContent = document.getElementById('result-content');
            
            resultBox.style.display = 'block';
            resultContent.innerHTML = `
                <div class="result-item ${isSamePerson ? 'match' : 'nomatch'}">
                    <strong>Result:</strong> ${isSamePerson ? '✅ SAME PERSON' : '❌ DIFFERENT PERSON'}
                </div>
                <div class="result-item">
                    <strong>Euclidean Distance:</strong> ${distance.toFixed(4)}<br>
                    <strong>Similarity:</strong> ${similarity}%<br>
                    <strong>Threshold:</strong> ${DISTANCE_THRESHOLD} (lower = more similar)
                </div>
                <div class="descriptor-preview">
                    <strong>Person A descriptor (first 10):</strong><br>
                    ${Array.from(faceDescriptorA).slice(0, 10).map(v => v.toFixed(3)).join(', ')}...
                </div>
                <div class="descriptor-preview">
                    <strong>Person B descriptor (first 10):</strong><br>
                    ${Array.from(faceDescriptorB).slice(0, 10).map(v => v.toFixed(3)).join(', ')}...
                </div>
            `;

            setStatus(isSamePerson ? 
                `✅ MATCH! Distance: ${distance.toFixed(4)}` : 
                `❌ NO MATCH. Distance: ${distance.toFixed(4)}`, 
                isSamePerson ? 'success' : 'error'
            );
        }

        // Reset
        function resetTest() {
            faceDescriptorA = null;
            faceDescriptorB = null;
            document.getElementById('result-box').style.display = 'none';
            document.getElementById('btn-compare').disabled = true;
            
            const ctx = captured.getContext('2d');
            ctx.clearRect(0, 0, captured.width, captured.height);
            
            log('Test reset. Ready for new captures.');
            setStatus('✅ Reset complete. Capture faces again.', 'success');
        }

        // Init on page load
        window.addEventListener('load', () => {
            document.getElementById('log').textContent = 'Initializing...';
            loadModels();
        });
    </script>
</body>
</html>
